<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Status Checker — NIC Kurukshetra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E85D04;
    --saffron-light: #FFF3EC;
    --saffron-dark: #9C3B00;
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-dark: #085041;
    --ink: #1A1A2E;
    --ink-soft: #3D3D5C;
    --muted: #7A7A9A;
    --surface: #FAFAF8;
    --white: #FFFFFF;
    --border: rgba(26,26,46,0.12);
    --shadow: 0 2px 16px rgba(26,26,46,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .chakra-strip {
    width: 100%;
    max-width: 520px;
    height: 3px;
    background: linear-gradient(90deg, var(--saffron) 0%, #F7B731 50%, var(--teal) 100%);
    border-radius: 2px 2px 0 0;
  }

  .card {
    background: var(--white);
    width: 100%;
    max-width: 520px;
    border: 0.5px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 2.5rem 2.5rem 2rem;
    box-shadow: var(--shadow);
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    background: var(--teal-light);
    border-radius: 20px;
    padding: 4px 14px;
    margin-bottom: 1rem;
    font-weight: 600;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 0.4rem;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  .hindi {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: 15px;
    color: var(--saffron);
    display: block;
    margin-top: 6px;
  }

  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 1.5rem 0;
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="url"] {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--saffron);
    box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.12);
    background: var(--white);
  }

  input::placeholder { color: var(--muted); font-family: 'Syne', sans-serif; font-size: 13px; }

  .btn {
    width: 100%;
    height: 48px;
    background: var(--saffron);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 1.5rem;
  }

  .btn:hover { background: var(--saffron-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

  .btn svg { width: 18px; height: 18px; }

  #result-box {
    margin-top: 1.25rem;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    display: none;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid transparent;
  }

  #result-box.success {
    background: var(--teal-light);
    border-color: #9FE1CB;
    color: var(--teal-dark);
    display: flex;
  }

  #result-box.error {
    background: #FCEBEB;
    border-color: #F7C1C1;
    color: #791F1F;
    display: flex;
  }

  #result-box.loading {
    background: #FFF3EC;
    border-color: #FFCBA4;
    color: var(--saffron-dark);
    display: flex;
  }

  .dot-loader {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .dot-loader span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--saffron);
    animation: blink 1.2s infinite;
  }
  .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
  .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1.5rem;
    letter-spacing: 0.03em;
  }

  .nic-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 2rem;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nic-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--saffron); }
</style>
</head>
<body>

<div class="chakra-strip"></div>

<div class="card">
  <div class="header">
    <span class="badge">NIC Kurukshetra</span>
    <h1>Website Status Checker</h1>
    <p class="subtitle">Enter site details to trigger an instant availability check</p>
    <span class="hindi">वेबसाइट उपलब्धता जाँच</span>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label for="site_name">Site Name</label>
    <input type="text" id="site_name" placeholder="e.g. NIC Kurukshetra District Portal" maxlength="80" />
  </div>

  <div class="field">
    <label for="site_url">Site URL</label>
    <input type="url" id="site_url" placeholder="https://kurukshetra.nic.in" />
  </div>

  <button class="btn" id="checkBtn" onclick="checkSite()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    Check Now
  </button>

  <div id="result-box">
    <span id="result-icon"></span>
    <span id="result-msg"></span>
  </div>

  <p class="footer-note">Triggers n8n workflow · Sends Gmail alert if site is DOWN</p>
</div>

<div class="nic-brand">
  <div class="nic-dot"></div>
  National Informatics Centre · Kurukshetra
  <div class="nic-dot"></div>
</div>

<script>
  const WEBHOOK_URL = "https://YOUR-N8N-INSTANCE.com/webhook/site-checker";

  function showResult(type, icon, msg) {
    const box = document.getElementById('result-box');
    box.className = type;
    document.getElementById('result-icon').textContent = icon;
    document.getElementById('result-msg').innerHTML = msg;
  }

  async function checkSite() {
    const name = document.getElementById('site_name').value.trim();
    const url  = document.getElementById('site_url').value.trim();
    const btn  = document.getElementById('checkBtn');

    if (!name) { showResult('error', '⚠', 'Please enter a site name.'); return; }
    if (!url || !url.startsWith('http')) { showResult('error', '⚠', 'Please enter a valid URL starting with https://'); return; }

    btn.disabled = true;
    btn.innerHTML = `<span class="dot-loader"><span></span><span></span><span></span></span> Checking…`;

    showResult('loading', '⏳', `Sending check request for <strong>${name}</strong>…`);

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ site_name: name, url: url })
      });

      if (res.ok) {
        showResult('success', '✅', `Request sent for <strong>${name}</strong>.<br>
          <span style="font-weight:400;font-size:13px;opacity:0.85">n8n will now check the site. If it is DOWN, a Gmail alert will be sent.</span>`);
      } else {
        showResult('error', '✗', `Webhook returned HTTP ${res.status}. Please check your n8n URL.`);
      }
    } catch (e) {
      showResult('error', '✗', `Could not reach n8n. Check WEBHOOK_URL or CORS settings.<br><small>${e.message}</small>`);
    }

    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Check Now`;
  }

  document.getElementById('site_url').addEventListener('keydown', e => { if(e.key==='Enter') checkSite(); });
</script>

</body>
</html>
